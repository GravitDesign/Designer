<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The loading screen's mark (index.html): mark-on-dark.svg, animated.
    First the planet pops in, the ring draws around it and the node pops in
    at the ring's end; then the node orbits, behind the planet on the back
    half and in front of it on the front half (two copies on the same path).
  -->
  <defs>
    <clipPath id="ld-sph"><circle cx="785.88" cy="679.0" r="481.8"/></clipPath>
    <clipPath id="ld-front"><rect x="-64" y="128" width="384" height="192"/></clipPath>
    <mask id="ld-gap" maskUnits="userSpaceOnUse" x="-64" y="-64" width="384" height="384">
      <rect x="-64" y="-64" width="384" height="384" fill="#fff"/>
      <circle cx="123" cy="128" r="80" fill="#000"/>
    </mask>
  </defs>

  <!-- The back half of the ring, with the gap around the planet. -->
  <g mask="url(#ld-gap)">
    <g transform="rotate(-22 123 128)">
      <ellipse cx="123" cy="128" rx="112" ry="36" fill="none" stroke="#F4F3F8" stroke-width="14" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.35s" dur="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" fill="freeze"/>
      </ellipse>
      <g transform="translate(235 128)">
        <animateMotion path="M0 0 A112 36 0 0 1 -224 0 A112 36 0 0 1 0 0" begin="1.4s" dur="2.4s" repeatCount="indefinite"/>
        <!-- The node, kept upright in the tilted ring, popping in. -->
        <g transform="scale(0)">
          <animateTransform attributeName="transform" type="scale" values="0;1.25;1" keyTimes="0;0.6;1" begin="0.95s" dur="0.3s" fill="freeze"/>
          <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#E3136B" stroke="#F4F3F8" stroke-width="8" transform="rotate(22)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- The planet. -->
  <g transform="translate(123 128)">
    <g transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" values="0;1.08;1" keyTimes="0;0.7;1" begin="0s" dur="0.5s" fill="freeze"/>
      <g transform="scale(0.15359) translate(-785.88 -679.0)">
        <g clip-path="url(#ld-sph)">
          <rect x="0" y="0" width="1600" height="1400" fill="#FFD81F"/>
          <path d="M727 60 L727.6 200.5 L307.7 616.5 L60 700 L60 1300 L753.2 1300 L753.2 1159.6 C754.5 882.6 849.9 536.6 996.7 245.5 L996.7 60 Z" fill="#E3136B"/>
          <path d="M308.2 616.5 L728.6 200.5 L600 60 L60 60 L60 616.5 Z" fill="#C3DB4E"/>
          <path d="M307.3 623.1 L60 623 L60 700.4 L304.5 700.4 L619.9 347.1 Z" fill="#6E9A34"/>
          <path d="M619.9 347.1 L304.5 700.4 L60 700.4 L60 900 L342.4 867.8 L757 226 Z" fill="#C3DB4E"/>
          <path d="M1300 700 L1259.3 768.5 C1206.1 807.6 1151.5 851.1 1103.9 895.8 C995.8 997.3 933.6 1076.8 864.5 1154.3 L864.5 1300 L1300 1300 Z" fill="#6E9A34"/>
        </g>
      </g>
    </g>
  </g>

  <!-- The front half of the ring and the node while it passes in front. -->
  <g transform="rotate(-22 123 128)">
    <g clip-path="url(#ld-front)">
      <ellipse cx="123" cy="128" rx="112" ry="36" fill="none" stroke="#F4F3F8" stroke-width="14" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.35s" dur="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" fill="freeze"/>
      </ellipse>
      <g transform="translate(235 128)">
        <animateMotion path="M0 0 A112 36 0 0 1 -224 0 A112 36 0 0 1 0 0" begin="1.4s" dur="2.4s" repeatCount="indefinite"/>
        <!-- The node, kept upright in the tilted ring, popping in. -->
        <g transform="scale(0)">
          <animateTransform attributeName="transform" type="scale" values="0;1.25;1" keyTimes="0;0.6;1" begin="0.95s" dur="0.3s" fill="freeze"/>
          <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#E3136B" stroke="#F4F3F8" stroke-width="8" transform="rotate(22)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
