name: Gravit Designer (next)

on:
  push:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  parity:
    # The expected output was recorded on Windows; renders differ between
    # platforms, so the parity suite runs on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json
      # The old app, used as the reference, needs only express and ws.
      - name: Install the old app's server dependencies
        run: |
          cd "$(node -e "const fs=require('fs');console.log(fs.existsSync('legacy/server.js')?'legacy':'.')")"
          npm install --no-save --no-package-lock express@5 ws@8
      - run: npm ci
        working-directory: next
      - run: npx playwright install chromium
        working-directory: next
      - run: npx playwright test --project harness --project parity
        working-directory: next
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-results
          path: next/test-results/
