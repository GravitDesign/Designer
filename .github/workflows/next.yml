name: Gravit Designer (next)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_brand:
        description: >-
          Record the brand shots whose names match this pattern
          (e.g. "brand/(intro|dialog)-(light|dark)$") and upload them,
          instead of testing
        required: false
        default: ""

jobs:
  checks:
    if: inputs.record_brand == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The old app, which the parity suite and some unit tests read.
      - uses: actions/checkout@v4
        with:
          ref: parity-reference
          path: legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  parity:
    # The expected output was recorded on Windows; renders differ between
    # platforms, so the parity suite runs on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # The old app, which the parity suite and some unit tests read.
      - uses: actions/checkout@v4
        with:
          ref: parity-reference
          path: legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The old app's server needs express and ws; its desktop scenarios
      # need the Electron it was recorded with, or require() finds the new
      # app's Electron at the repo root.
      - name: Install the old app's dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5.1.0 mime-types@3.0.1 mime-db@1.54.0 ws@8.18.2 electron@33.4.11
      - run: npm ci
      - run: npx playwright install chromium
      # The desktop scenarios start the new app from dist-electron.
      - run: npx vite build --config vite.electron.config.ts
      # The runner's screen is 1024x768, smaller than the old app's
      # 1400x900 window, which Windows would shrink to fit.
      - name: Set the screen resolution
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: npx playwright test --project harness --project parity --shard ${{ matrix.shard }}/4
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-results-${{ matrix.shard }}
          path: test-results/

  brand:
    # The brand scenarios run twice in a row, to catch shots that only
    # match some of the time.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: checks
    steps:
      - uses: actions/checkout@v4
      # The old app, which the parity suite and some unit tests read.
      - uses: actions/checkout@v4
        with:
          ref: parity-reference
          path: legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the old app's server dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5.1.0 mime-types@3.0.1 mime-db@1.54.0 ws@8.18.2
      - run: npm ci
      - run: npx playwright install chromium
      - name: Brand scenarios, first run
        run: npx playwright test --project=parity parity/scenarios/brand
        env:
          CI: "1"
          GD_RUN: brand-1
      - name: Brand scenarios, second run
        run: npx playwright test --project=parity parity/scenarios/brand
        env:
          CI: "1"
          GD_RUN: brand-2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: brand-results
          path: test-results/

  record-brand:
    # Recorded on the same runner image as the brand job, so the shots
    # match what CI renders.
    if: inputs.record_brand != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The old app, which the parity suite and some unit tests read.
      - uses: actions/checkout@v4
        with:
          ref: parity-reference
          path: legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the old app's server dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5.1.0 mime-types@3.0.1 mime-db@1.54.0 ws@8.18.2
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --project=parity parity/scenarios/brand --grep "$PATTERN"
        env:
          CI: "1"
          GD_RECORD_BRAND: "1"
          PATTERN: ${{ inputs.record_brand }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-recording
          path: parity/expected/brand/
