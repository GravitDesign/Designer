name: Gravit Designer (next)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_brand:
        description: >-
          Record the brand shots whose names match this pattern
          (e.g. "brand/(intro|dialog)-(light|dark)$") and upload them,
          instead of testing
        required: false
        default: ""

jobs:
  checks:
    if: inputs.record_brand == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  parity:
    # The expected output was recorded on Windows; renders differ between
    # platforms, so the parity suite runs on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The old app, used as the reference, needs only express and ws.
      - name: Install the old app's server dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5 ws@8
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --project harness --project parity --shard ${{ matrix.shard }}/4
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-results-${{ matrix.shard }}
          path: test-results/

  brand:
    # The brand scenarios run twice in a row, to catch shots that only
    # match some of the time.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the old app's server dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5 ws@8
      - run: npm ci
      - run: npx playwright install chromium
      - name: Brand scenarios, first run
        run: npx playwright test --project=parity parity/scenarios/brand
        env:
          CI: "1"
          GD_RUN: brand-1
      - name: Brand scenarios, second run
        run: npx playwright test --project=parity parity/scenarios/brand
        env:
          CI: "1"
          GD_RUN: brand-2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: brand-results
          path: test-results/

  record-brand:
    # Recorded on the same runner image as the brand job, so the shots
    # match what CI renders.
    if: inputs.record_brand != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the old app's server dependencies
        working-directory: legacy
        run: npm install --no-save --no-package-lock express@5 ws@8
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --project=parity parity/scenarios/brand --grep "$PATTERN"
        env:
          CI: "1"
          GD_RECORD_BRAND: "1"
          PATTERN: ${{ inputs.record_brand }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-recording
          path: parity/expected/brand/
